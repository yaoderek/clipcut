<!doctype html><html><head><meta charset="utf-8"><title>ClipCut canvas</title>
<style>
:root{--bg:#0a0c11;--panel:#141821;--panel2:#1b2030;--line:#2a3144;--txt:#e7eaf2;--mut:#8b93a7;--acc:#7c5cff;--acc2:#22d3ee;--win:#facc15;--ok:#34d399;--warn:#fb923c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#vp{position:absolute;inset:0;cursor:grab;background-image:radial-gradient(#1c2232 1px,transparent 1px);background-size:24px 24px}
#vp.panning{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.blk{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #0008}
.blk>.hd{padding:9px 12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:move;border-bottom:1px solid var(--line);user-select:none}
.blk>.hd .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.blk .bd{padding:10px 12px}.mut{color:var(--mut)}
.src{border-color:#3b4560}.src img,.src video,.mom video{width:100%;border-radius:8px;display:block;background:#000}
.mom video{max-height:148px;object-fit:cover}
.mom .bd{font-size:12.5px}.mom q{display:block;color:#c7cde0;font-style:italic;margin-top:4px}
.clip .thumb{position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}.clip .thumb img,.clip .thumb video{width:100%;display:block}
.clip .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;opacity:.85;text-shadow:0 2px 10px #000}
.clip.win{border:2px solid var(--win);box-shadow:0 0 0 4px #facc1522,0 10px 30px #0008}
.bs{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:#c7cde0;margin:3px 3px 0 0}
.tag.fit{color:var(--ok);border-color:#34d39966}.tag.ch{color:var(--acc2);border-color:#22d3ee66}.tag.wn{background:var(--win);color:#111;border:0;font-weight:800}
.grp{background:#10131bcc;border:1px dashed #3b4560}.grp>.hd{font-size:15px}
.dep{background:var(--panel2)}.dep table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}.dep td,.dep th{padding:3px 4px;text-align:right;border-top:1px solid var(--line)}.dep th{color:var(--mut);font-weight:500}
.dep td:first-child,.dep th:first-child{text-align:left}.dep tr.w td{color:var(--win);font-weight:700}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 8px}.split i{display:block;height:100%}
.empty{border-style:dashed;opacity:.85}.empty .bd{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;color:var(--mut);text-align:center}
.x{margin-left:auto;cursor:pointer;color:var(--mut);font-weight:400}.x:hover{color:#fff}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#fb923c22;color:var(--warn);border:1px solid #fb923c55}
#bar{position:fixed;left:16px;top:14px;display:flex;gap:8px;align-items:center;z-index:5;background:#141821e6;border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(6px)}
#bar .logo{font-weight:800;font-size:17px;margin-right:6px}#bar .logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
button,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}button.pri{background:linear-gradient(90deg,var(--acc),#5b8cff);border:0;font-weight:600}
#mini{position:fixed;right:16px;bottom:16px;width:240px;height:160px;background:#0e1118ee;border:1px solid var(--line);border-radius:10px;z-index:5;cursor:crosshair}
#chips{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 560px);background:#141821e6;border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(6px)}
#chips b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-right:2px}
#chips [data-chip]{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:grab;white-space:nowrap;user-select:none}
#chips [data-chip]:active{cursor:grabbing}
.blk.hot{outline:2px solid var(--acc2);outline-offset:2px}
#ghost{position:fixed;z-index:30;pointer-events:none;display:none;padding:6px 10px;border-radius:8px;background:#7c5cff;color:#fff;font-weight:700}
a.zip{margin-left:auto;color:var(--txt);text-decoration:none;font-size:14px;line-height:1}
a.zip[hidden]{display:none}
#detail select{margin-left:6px}
#detail{position:fixed;left:16px;bottom:16px;width:260px;z-index:6;background:#141821e6;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
#detail summary{cursor:pointer;padding:8px 10px;font-weight:700}
#detail .bd{padding:8px 10px 12px;max-height:36vh;overflow:auto;border-top:1px solid var(--line)}
#zoomlbl{min-width:44px;text-align:center}a{color:var(--acc2)}
</style></head><body>
<div id="vp"><div id="world"><svg id="wires"></svg></div></div>
<div id="bar"><div class="logo">Clip<span>Cut</span></div><select id="runsel"></select>
 <button id="fit">⤢ Zoom to fit</button><button id="zout">−</button><span id="zoomlbl" class="mut">100%</span><button id="zin">+</button>
 <select id="addch"><option value="">+ Add channel</option></select><label class="pri" style="background:linear-gradient(90deg,#7c5cff,#5b8cff);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600">⬆ Upload video<input id="up" type="file" accept="video/*" hidden></label><span id="jobmsg" class="mut"></span><span class="pill">heuristic scores · simulated A/B</span><a href="/classic" style="margin-left:6px">classic view</a></div>
<canvas id="mini" width="480" height="320"></canvas>
<div id="chips"><b>Edit</b><span data-chip="captions">Captions</span><span data-chip="zoom">Zoom punch-ins</span><span data-chip="len15">15s</span><span data-chip="len30">30s</span><span data-chip="len45">45s</span><span data-chip="hook">Hook</span><span data-chip="crop">Crop</span><span data-chip="music">Music</span><span data-chip="approaches">Try approaches</span><span data-chip="publish">Publish</span></div>
<div id="ghost"></div>
<details id="detail"><summary>Details</summary><div class="bd" id="detailbody"></div></details>
<script>
const $=s=>document.querySelector(s),world=$('#world'),vp=$('#vp'),svg=$('#wires');
let T={x:40,y:80,k:.5},RUN=null,D={},SHOWN=new Set(),LISTCH=[];
const PLAT={TikTok:'TikTok',Reels:'Instagram',IG_Feed:'Instagram',IG_Stories:'Instagram',Shorts:'YouTube',YouTube:'YouTube',FB_Reels:'Facebook',FB_Feed:'Facebook',X:'X',LinkedIn:'LinkedIn'};
const PICON={TikTok:'♪',Instagram:'◎',YouTube:'▶',Facebook:'f',X:'𝕏',LinkedIn:'in'},PAL=["#7c5cff","#22d3ee","#f472b6","#34d399","#fb923c","#facc15","#a3e635","#e879f9"];
const plat=c=>PLAT[c.name]||c.platform||c.name;
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}
function apply(){world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`;$('#zoomlbl').textContent=Math.round(T.k*100)+'%';mini()}
// ---------- pan / zoom ----------
let pan=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.blk'))return;pan={x:e.clientX-T.x,y:e.clientY-T.y};vp.classList.add('panning');vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(pan){T.x=e.clientX-pan.x;T.y=e.clientY-pan.y;apply()}});
vp.addEventListener('pointerup',()=>{pan=null;vp.classList.remove('panning')});
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0015))},{passive:false});
function zoomAt(cx,cy,f){const k=Math.min(2.5,Math.max(.08,T.k*f));T.x=cx-(cx-T.x)*k/T.k;T.y=cy-(cy-T.y)*k/T.k;T.k=k;apply()}
$('#zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.25);$('#zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,.8);
function bounds(els){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;els.forEach(el=>{const p=pos(el);x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+el.offsetWidth);y1=Math.max(y1,p.y+el.offsetHeight)});return {x0,y0,x1,y1}}
function fitTo(els,pad=60){const b=bounds(els),W=innerWidth,H=innerHeight-70;T.k=Math.min(2.5,Math.min((W-2*pad)/(b.x1-b.x0),(H-2*pad)/(b.y1-b.y0)));T.x=pad+(W-2*pad-(b.x1-b.x0)*T.k)/2-b.x0*T.k;T.y=70+pad+(H-2*pad-(b.y1-b.y0)*T.k)/2-b.y0*T.k;apply()}
$('#fit').onclick=()=>fitTo([...world.querySelectorAll(':scope>.blk')]);
window.CC={fitTo,zoomTo:id=>fitTo([document.getElementById(id)],40)};
// ---------- blocks ----------
function pos(el){let x=0,y=0;while(el&&el!==world){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent}return {x,y}}
function blk(parent,id,cls,x,y,w,head,body){const d=document.createElement('div');d.className='blk '+cls;d.id=id;d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';
 d.innerHTML=`<div class="hd">${head}</div><div class="bd">${body}</div>`;parent.appendChild(d);drag(d);return d}
function drag(d){const h=d.querySelector('.hd');h.addEventListener('pointerdown',e=>{if(e.target.closest('.x'))return;e.stopPropagation();const sx=e.clientX,sy=e.clientY,ox=d.offsetLeft,oy=d.offsetTop;h.setPointerCapture(e.pointerId);
 const mv=ev=>{d.style.left=ox+(ev.clientX-sx)/T.k+'px';d.style.top=oy+(ev.clientY-sy)/T.k+'px';wires()};const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)})}
// ---------- wires ----------
let LINKS=[];
function wires(){let s='';const fx=Math.max(...[...world.querySelectorAll(':scope>.blk')].map(e=>pos(e).x+e.offsetWidth))+200;
 LINKS.forEach(([a,b,c,w,o])=>{const A=document.getElementById(a),B=document.getElementById(b);if(!A||!B)return;const pa=pos(A),pb=pos(B);
  const x1=pa.x+A.offsetWidth,y1=pa.y+Math.min(A.offsetHeight/2,60),x2=pb.x,y2=pb.y+Math.min(B.offsetHeight/2,40),mx=(x1+x2)/2;
  s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${c}" stroke-width="${w}" fill="none" opacity="${o}"/><circle cx="${x2}" cy="${y2}" r="${w+1.5}" fill="${c}" opacity="${Math.min(1,o+.3)}"/>`});
 svg.setAttribute('width',fx);svg.setAttribute('height',4000);svg.innerHTML=s;mini()}
// ---------- minimap ----------
function mini(){const c=$('#mini'),g=c.getContext('2d'),els=[...world.querySelectorAll(':scope>.blk')];g.clearRect(0,0,c.width,c.height);if(!els.length)return;
 const b=bounds(els),pad=20,s=Math.min((c.width-2*pad)/(b.x1-b.x0),(c.height-2*pad)/(b.y1-b.y0));c._m={b,s,pad};
 els.forEach(el=>{const p=pos(el);g.fillStyle=el.classList.contains('grp')?'#22d3ee33':el.classList.contains('clip')?(el.classList.contains('win')?'#facc15':'#7c5cff88'):'#8b93a766';g.fillRect(pad+(p.x-b.x0)*s,pad+(p.y-b.y0)*s,Math.max(2,el.offsetWidth*s),Math.max(2,el.offsetHeight*s))});
 g.strokeStyle='#e7eaf2';g.lineWidth=2;let rx=pad+(-T.x/T.k-b.x0)*s,ry=pad+(-T.y/T.k-b.y0)*s,rw=innerWidth/T.k*s,rh=innerHeight/T.k*s;const x0=Math.max(1,rx),y0=Math.max(1,ry),x1=Math.min(c.width-1,rx+rw),y1=Math.min(c.height-1,ry+rh);if(x1>x0&&y1>y0)g.strokeRect(x0,y0,x1-x0,y1-y0)}
const mc=$('#mini');let md=false;const mgo=e=>{const r=mc.getBoundingClientRect(),m=mc._m;if(!m)return;const wx=((e.clientX-r.left)*mc.width/r.width-m.pad)/m.s+m.b.x0,wy=((e.clientY-r.top)*mc.height/r.height-m.pad)/m.s+m.b.y0;T.x=innerWidth/2-wx*T.k;T.y=innerHeight/2-wy*T.k;apply()};
mc.onpointerdown=e=>{md=true;mgo(e)};mc.onpointermove=e=>md&&mgo(e);onpointerup=()=>md=false;
// ---------- build ----------
const f=(x,d,m=1,suf='')=>x==null?'–':(x*m).toFixed(d)+suf,kf=x=>x>=1000?(x/1000).toFixed(x>=10000?0:1)+'k':String(x),rng=a=>Array.isArray(a)?`${kf(a[0])}–${kf(a[1])}`:'–';
async function load(run){RUN=run;[...world.querySelectorAll('.blk')].forEach(e=>e.remove());LINKS=[];
 const [s,ch,lc]=await Promise.all([j('/api/run/'+run),j('/api/channels/'+run).catch(()=>({blocks:[]})),j('/api/list_channels')]);
 D={s,ch,lc};LISTCH=lc.channels;const res=s.results;if(!res){return}
 // source
 const srcPoster=res[0].poster,srcVid=res[0].video;const srcEl=blk(world,'src','src',0,600,300,`<span class="k">source</span> raw video`,`<div class="thumb" data-v="${srcVid}"><video src="${srcVid}" poster="${srcPoster}" muted loop playsinline autoplay></video></div><div class="mut" style="margin-top:6px">${res.length} clips</div>`);srcEl.dataset.variant=res[0].variant_id;
 // moments
 const moms=[...new Set(res.map(r=>r.recipe.hook))].sort(),ROW=470;
 blk(world,'pipe','',420,40,180,`<span class="k">pipeline</span>`,`<div class="mut" style="font-size:11.5px">transcribe → pick_moments → cold-open hook ≤3s → captions · punch-ins · loop → render per format</div>`);
 moms.forEach((m,i)=>{const r=res.find(x=>x.recipe.hook===m),t=r.hook_phrase||r.hook_text||'';const n=res.filter(x=>x.recipe.hook===m).length;
  const md=blk(world,'mom_'+m,'mom',420,200+i*ROW,260,`<span class="k">moment ${m.slice(1)}</span> ${n} clips`,`<div class="thumb" data-v="${r.video}"><video src="${r.video}" poster="${r.poster}" muted loop playsinline autoplay></video></div><q>“${t}”</q>`);md.dataset.variant=r.variant_id;
  LINKS.push(['src','mom_'+m,PAL[i%8],3,.5])});
 // clips
 moms.forEach((m,i)=>{res.filter(x=>x.recipe.hook===m).sort((a,b)=>b.batch_score-a.batch_score).forEach((r,k)=>{const win=r.variant_id===s.winner,ar=(r.aspect||'9:16').replace(':','/');
  const fit=r.suggested&&r.target_channel&&r.suggested!==r.target_channel?`<span class="tag fit">better fit: ${r.suggested}</span>`:'';
  const d=blk(world,'clip_'+r.variant_id,'clip'+(win?' win':''),760+k*215,200+i*ROW,200,`${win?'<span class="tag wn">★ WINNER</span>':''}${r.variant_id} <span class="mut" style="font-weight:400">${r.duration_s.toFixed(0)}s</span><span class="bs" style="margin-left:auto">${r.batch_score!=null?r.batch_score.toFixed(0):'–'}<span class="mut" style="font-size:10px">/100</span></span>`,
   `<div class="thumb" style="aspect-ratio:${ar}" data-v="${r.video}"><video src="${r.video}" poster="${r.poster}" muted loop playsinline autoplay></video></div>
    <span class="tag ch">▶ ${r.target_channel||'—'} · ${r.aspect||'9:16'}</span>${fit}<span class="tag">${r.recipe.captions}</span><span class="tag">${r.recipe.pacing}</span>`);
  d.dataset.variant=r.variant_id;
  LINKS.push(['mom_'+m,'clip_'+r.variant_id,PAL[i%8],2,.45])})});
 // channel groups
 SHOWN=new Set(ch.blocks.map(b=>b.channel));if(LISTCH.some(c=>c.name==='YouTube'))SHOWN.add('YouTube');
 drawChannels();fillAdd();setTimeout(()=>{wires();fitTo([...world.querySelectorAll(':scope>.blk')])},50)}
function drawChannels(){[...world.querySelectorAll('.grp')].forEach(e=>e.remove());LINKS=LINKS.filter(l=>!l[1].startsWith('dep_'));
 const byP={};LISTCH.filter(c=>SHOWN.has(c.name)).forEach(c=>{(byP[plat(c)]=byP[plat(c)]||[]).push(c)});
 const order=['TikTok','Instagram','YouTube','Facebook','X','LinkedIn'],plats=Object.keys(byP).sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99);
 let y=0;const X0=1900,DW=430,DH=470;
 plats.forEach(p=>{const cs=byP[p],g=blk(world,'grp_'+p,'grp',X0,y,cs.length*(DW+16)+16,`<span style="font-size:18px">${PICON[p]||'●'}</span> ${p} <span class="mut" style="font-weight:400;font-size:12px">${cs.length} placement${cs.length>1?'s':''}</span>`,'');
  g.style.height=(DH+70)+'px';const body=g.querySelector('.bd');body.style.position='relative';body.style.height=(DH+20)+'px';
  cs.forEach((c,i)=>{const b=D.ch.blocks.find(x=>x.channel===c.name);dep(body,c,b,8+i*(DW+16),6,DW)});y+=DH+110});
 wires();mini()}
function dep(parent,c,b,x,y,w){const id='dep_'+c.name,asp=(c.aspect||[]).join('/'),ideal=c.ideal_s?`${c.ideal_s[0]}–${c.ideal_s[1]}s`:'';
 const head=`<span class="k">deploy</span> ${c.name.replace('_',' ')} <span class="mut" style="font-weight:400;font-size:11px">${asp} · ${ideal}</span><span class="x" title="remove" data-c="${c.name}">✕</span>`;
 if(!b||!b.items.length){const need=(c.aspect||['16:9'])[0];const d=blk(parent,id,'dep empty',x,y,w,head,`<div style="font-size:30px">＋</div><b>needs ${need} clip</b><div>No rendered clip matches ${asp}. Render a ${need} ${c.ideal_s?c.ideal_s[0]+'s+':''} cut to deploy here.</div>`);hookX(d);return}
 const items=b.items.slice(0,6),win=b.winner,close=b.too_close;
 const d=blk(parent,id,'dep',x,y,w,head,`<div style="font-size:12px">${close?`<span class="pill">too close to call</span> <span class="mut">${close.between.join(' vs ')}</span>`:`A/B winner <b style="color:var(--win)">★ ${win}</b>`} <span class="mut">· ${b.items.length} candidates</span></div>
  <div class="split">${b.items.map((i,k)=>`<i title="${i.variant_id} ${i.ab.traffic_pct}%" style="width:${i.ab.traffic_pct||0}%;background:${PAL[k%8]}"></i>`).join('')}</div>
  <table><tr><th>clip</th><th>P(best)</th><th>traffic</th><th>views*</th><th>watch*</th><th>swipe*</th><th>shares*</th></tr>
  ${items.map((i,k)=>`<tr class="${i.variant_id===win&&!close?'w':''}"><td><span style="color:${PAL[k%8]}">■</span> ${i.variant_id}</td><td>${f(i.ab.p_best,0,100,'%')}</td><td>${f(i.ab.traffic_pct,0,1,'%')}</td><td>${rng(i.pred.views_range)}</td><td>${f(i.pred.watch_pct,0,1,'%')}</td><td>${f(i.pred.p_swipe3s??i.pred.swipe_away,0,100,'%')}</td><td>${rng(i.pred.shares_range)}</td></tr>`).join('')}</table>
  ${b.items.length>6?`<div class="mut" style="font-size:11px">+${b.items.length-6} more in split</div>`:''}<div class="mut" style="font-size:10.5px;margin-top:6px">* simulated estimate · ${b.ab_source}</div>`);
 hookX(d);
 b.items.slice(0,3).forEach((i,k)=>LINKS.push(['clip_'+i.variant_id,id,k===0&&!close?'#facc15':'#8b93a7',k===0?3:1.5,k===0?.85:.3]))}
function hookX(d){d.querySelector('.x').onclick=e=>{SHOWN.delete(e.target.dataset.c);drawChannels();fillAdd()}}
function fillAdd(){const s=$('#addch');s.innerHTML='<option value="">+ Add channel</option>'+LISTCH.filter(c=>!SHOWN.has(c.name)).map(c=>`<option>${c.name}</option>`).join('')}
$('#addch').onchange=e=>{if(!e.target.value)return;SHOWN.add(e.target.value);drawChannels();fillAdd();CC.zoomTo('dep_'+e.target.value)};
addEventListener('resize',mini);
$('#up').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;const st=await j('/api/status');
 if(st.busy){$('#jobmsg').textContent=`Busy: ${st.run} is rendering — one job at a time.`;return}
 if(fl.size>st.max_upload_mb*2**20){$('#jobmsg').textContent=`File too large (max ${st.max_upload_mb} MB).`;return}
 const fd=new FormData();fd.append('video',fl);fd.append('n','12');$('#jobmsg').textContent='Uploading…';
 const r=await fetch('/api/cut',{method:'POST',body:fd});const b=await r.json();if(!r.ok){$('#jobmsg').textContent=b.detail||'failed';return}
 const poll=async()=>{const s=await j('/api/run/'+b.run);if(s.error){$('#jobmsg').textContent='Failed: '+s.error;return}
  if(s.running||!s.results){$('#jobmsg').textContent=`${b.run}: rendered ${s.rendered}/${s.n} · scored ${s.scored}/${s.n}`;setTimeout(poll,3000);return}
  $('#jobmsg').textContent='';$('#runsel').add(new Option(b.run,b.run));$('#runsel').value=b.run;load(b.run)};poll()};
(async()=>{const runs=await j('/api/runs');runs.forEach(r=>$('#runsel').add(new Option(r,r)));$('#runsel').onchange=e=>load(e.target.value);if(runs.length)await load(runs[0]);window.READY=true})();
// Drag an edit chip onto a video. New node shows that video at once, then /api/branch swaps in the render.
const CHIP_NAME={captions:'Captions',zoom:'Zoom punch-ins',len15:'15s',len30:'30s',len45:'45s',hook:'Hook',crop:'Crop',music:'Music',approaches:'Try approaches',publish:'Publish'};
const DIST_CHANNELS=['tiktok','shorts','reels','x','linkedin'];
let seq=1, chipDrag=null;
function chipSettings(chips){
  const s={hook:'strongest',length:30,pacing:'tight_punch',captions:'sentence',hook_title:false,ending:'loop',aspect:'9:16',channel:'TikTok'};
  chips.forEach(c=>{
    if(c==='captions')s.captions='word_pop';
    if(c==='zoom')s.pacing='tight_punch';
    if(c==='len15')s.length=15;
    if(c==='len30')s.length=30;
    if(c==='len45')s.length=45;
    if(c==='hook'){s.hook='strongest';s.hook_title=true}
    if(c==='crop'){s.aspect='9:16';s.channel='TikTok'}
  });
  return s;
}
function mediaOf(el){
  const v=el&&el.querySelector('video'); if(!v)return null;
  return {video:v.getAttribute('src')||v.currentSrc, poster:v.getAttribute('poster')||''};
}
function setTag(el, text){const t=el.querySelector('[data-srctag]'); if(t)t.textContent=text}
function spawnNode(parent, chips, label, video, poster, variant){
  const id='x_'+ (seq++);
  const p=pos(parent);
  const x=p.x, y=p.y+parent.offsetHeight+28;
  const head=`<span class="k">${label}</span><span class="tag" data-srctag>simulated</span>`;
  const body=`<div class="thumb" data-v="${video}"><video src="${video}" poster="${poster}" muted loop playsinline autoplay></video></div>`;
  const el=blk(world,id,'clip',x,y,200,head,body);
  el.dataset.chips=chips.join(',');
  el.dataset.variant=variant||'';
  el.dataset.keep='1';
  LINKS.push([parent.id,id,'#22d3ee',2,.7]);
  wires();
  return el;
}
function chipObject(name){
  if(name==='captions')return {type:'captions', params:{style:'bold'}};
  if(name==='zoom')return {type:'zoom', params:{punch_ins:true, intensity:1}};
  if(name==='len15')return {type:'length', params:{seconds:15}};
  if(name==='len30')return {type:'length', params:{seconds:30}};
  if(name==='len45')return {type:'length', params:{seconds:45}};
  if(name==='hook')return {type:'hook', params:{}};
  if(name==='crop')return {type:'crop', params:{aspect:'9:16'}};
  if(name==='music')return {type:'music', params:{track:'upbeat'}};
  return null;
}
function addDetail(text){
  if(!text)return;
  const b=$('#detailbody'); if(!b)return;
  if([...b.children].some(n=>n.textContent===text))return;
  const p=document.createElement('p'); p.className='mut'; p.textContent=text; b.appendChild(p);
}
function applyBranch(el, body){
  if(!body)return;
  const v=el.querySelector('video'); if(!v)return;
  const st=String(body.status||'');
  const poster=body.thumb_url||body.poster||body.thumbnail;
  if(poster)v.poster=poster;
  let src=null;
  if(st==='done')src=body.video_url||null;
  else if(st==='preview')src=body.preview_url||body.preview_video||null;
  if(src && src!==v.getAttribute('src')){v.src=src; v.play().catch(()=>{})}
  if(st==='preview')el.dataset.sawPreview='1';
  if(st==='done')el.dataset.sawFull='1';
  const srcTag=(body.score&&body.score.source)||body.source;
  if(srcTag==='heuristic'||srcTag==='simulated')setTag(el, srcTag);
  if(body.music_placeholder)addDetail(body.music_label||'ffmpeg-generated sine bed (placeholder, not a licensed track)');
  if(body.score&&body.score.disclaimer)addDetail(body.score.disclaimer);
  if(body.timing)el._timing=body.timing;
}
function noteDetail(lines){const b=$('#detailbody'); if(!b)return; b.replaceChildren(); (lines||[]).forEach(line=>{const p=document.createElement('p'); p.className='mut'; p.textContent=line; b.appendChild(p)})}
async function quickScore(el, run){
  if(!run)return;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),1200);
  try{
    const r=await fetch('/api/persona/score',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({run, variant_ids:['v01'], mode:'auto'})});
    clearTimeout(timer);
    if(!r.ok){setTag(el,'simulated'); return}
    const b=await r.json();
    const src=b.source==='llm'?'Grok':(b.source==='model'?'calibrated':(b.source==='heuristic'?'heuristic':'simulated'));
    setTag(el, src);
    const v=(b.variants||[])[0]; const top=v&&(v.personas||[]).slice().sort((a,c)=>Number(c.score)-Number(a.score))[0];
    if(b.disclaimer)noteDetail([b.disclaimer].concat((top&&top.reasons)||[]));
  }catch(e){setTag(el,'simulated')}
}
async function pollLive(el, id){
  for(let i=0;i<160;i++){
    if(i)await new Promise(r=>setTimeout(r,400));
    let body=null;
    try{body=await j('/api/branch/'+encodeURIComponent(id))}catch(e){if(i<4)continue; throw e}
    applyBranch(el, body);
    el.dataset.branchStatus=body.status||'';
    if(body.status==='preview' && !el.dataset.tPreview)el.dataset.tPreview=String(Date.now());
    if(body.status==='done'){el.dataset.tDone=String(Date.now()); return body}
    if(body.status==='error')return body;
  }
  throw new Error('branch timed out');
}
async function pollStub(el, batch){
  for(let i=0;i<180;i++){
    await new Promise(r=>setTimeout(r,1000));
    let st; try{st=await j('/api/branch/status?batch='+encodeURIComponent(batch))}catch(e){return}
    const item=(st.items||[])[0]; if(!item)continue;
    if(item.status==='done' && item.video){
      applyBranch(el,{video_url:item.video, thumb_url:'/runs/'+item.run+'/.v01_poster.jpg', status:'done', source:'simulated'});
      quickScore(el, item.run);
      return item;
    }
    if(item.status==='error'){$('#jobmsg').textContent=item.error||'render failed'; return item}
  }
}
let branchInflight=0;
function settleId(el, id){if(el._settled)return; el._settled=true; if(el._resolveId)el._resolveId(id||'')}
async function postJson(url, payload){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  const body=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(body.detail||body.error||'branch failed');
  return body;
}
async function fallbackQueue(el, chips){
  const q=await j('/api/branch/queue',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
    sample:'talking_head_niosh.mp4',
    branches:[{key:'b1', name:el.querySelector('.k').textContent, settings:chipSettings(chips)}]
  })});
  await pollStub(el, q.batch);
}
async function callBranch(el, chips, variant, video){
  const parentEl=el.dataset.parent?document.getElementById(el.dataset.parent):null;
  if(parentEl&&parentEl._idReady)await Promise.race([parentEl._idReady, new Promise(r=>setTimeout(r,4000))]);
  const branchParent=parentEl&&parentEl.dataset.branchId;
  const names=(chips||[]).filter(c=>c&&c!=='approaches');
  const prevNames=parentEl?(parentEl.dataset.chips||'').split(',').filter(Boolean):[];
  const tail=branchParent?names.slice(prevNames.length):names;
  const todo=branchParent?(tail.length?tail:names.slice(-1)):names;
  branchInflight++; $('#jobmsg').textContent='Rendering preview…';
  el.dataset.t0=String(Date.now());
  try{
    let body;
    if(branchParent){
      let parent=branchParent;
      for(const name of todo){
        const spec=chipObject(name); if(!spec)continue;
        body=await postJson('/api/branch',{run:RUN, parent_variant_id:parent, chip:spec, video, variant_id:variant||null});
        parent=body.branch_id||body.id;
      }
    }else{
      body=await postJson('/api/branch',{run:RUN, variant_id:variant||null, parent:el.dataset.parent||null, chips:names, video, settings:chipSettings(names)});
    }
    const id=body&&(body.id||body.branch_id);
    if(!id)throw new Error('no branch id');
    el.dataset.branchId=id; settleId(el, id);
    applyBranch(el, body);
    const final=await pollLive(el, id);
    if(!final||final.status==='error')throw new Error((final&&final.error)||'branch error');
  }catch(e){
    settleId(el, el.dataset.branchId||'');
    if(el.dataset.sawPreview)addDetail(e.message||'Full render failed. Preview stays.');
    else{try{await fallbackQueue(el, names)}catch(err){$('#jobmsg').textContent='Preview stays on this clip'}}
  }finally{
    branchInflight=Math.max(0, branchInflight-1);
    if(!branchInflight)$('#jobmsg').textContent='';
  }
}
function startBranch(el, chips, variant, video){
  el._idReady=new Promise(res=>{el._resolveId=res});
  callBranch(el, chips, variant, video);
}
function detailP(text){const el=document.createElement('p'); el.className='mut'; el.textContent=text; return el}
function detailLink(href, label){const a=document.createElement('a'); a.href=href; a.textContent=label; a.target='_blank'; return a}
function setDetail(nodes){const b=$('#detailbody'); if(!b)return; b.replaceChildren(); (nodes||[]).forEach(n=>b.appendChild(n))}
function publishStatusTag(rows){
  const list=Array.isArray(rows)?rows:[];
  const order=['failed','uploading','uploaded (private)','scheduled (demo)','exported'];
  for(const s of order){if(list.some(e=>e.status===s))return s}
  return (list[0]&&list[0].status)||'exported';
}
function renderDistDetail(el){
  const data=el._export||{}, nodes=[];
  nodes.push(detailP('Exports are files. Nothing is posted unless publish reports uploaded (private).'));
  const sel=document.createElement('select');
  sel.innerHTML='<option value="export">Export</option><option value="publish">Publish</option>';
  sel.value=el.dataset.action==='publish'?'publish':'export';
  sel.onchange=()=>{el.dataset.action=sel.value; if(sel.value==='publish')runPublish(el)};
  const lab=document.createElement('p'); lab.className='mut'; lab.append('Action ', sel); nodes.push(lab);
  (data.channels||[]).forEach(c=>{
    const copy=c.copy||{}, video=c.video||{}, caps=c.captions||{};
    const extra=c.selection&&c.selection!=='requested'?' · '+c.selection:'';
    nodes.push(detailP((c.label||c.channel||'')+' · '+(c.variant_id||'')+extra+' · '+(video.status||'')));
    if(copy.title)nodes.push(detailP(copy.title));
    if(copy.caption)nodes.push(detailP(copy.caption));
    if(copy.source)nodes.push(detailP(copy.source));
    if(video.note)nodes.push(detailP(video.note));
    const links=document.createElement('p');
    if(caps.srt_url){links.append(detailLink(caps.srt_url,'SRT'), ' ')}
    if(caps.vtt_url){links.append(detailLink(caps.vtt_url,'VTT'), ' ')}
    if(c.post_url)links.append(detailLink(c.post_url,'Post'));
    if(links.childNodes.length)nodes.push(links);
  });
  if(data.disclaimer)nodes.push(detailP(data.disclaimer));
  const dash=el._dash;
  if(dash){
    if(!dash.metrics_available)nodes.push(detailP(dash.metrics_note||'No campaign metrics yet.'));
    else{
      const o=dash.overall||{};
      nodes.push(detailP('Thompson '+(o.thompson_winner||'–')+' · actual '+(o.top_actual||'–')));
      (dash.channels||[]).forEach(c=>{
        const w=c.winner_actual||{};
        nodes.push(detailP((c.label||c.channel)+' actual '+(w.id||'–')+' · predicted '+(c.predicted_top||'–')+(c.thompson_winner?' · thompson '+c.thompson_winner:'')));
      });
    }
    if(dash.simulated&&dash.disclaimer)nodes.push(detailP(dash.disclaimer));
  }
  const pub=el._publish;
  if(pub){
    if(pub.disclaimer)nodes.push(detailP(pub.disclaimer));
    const rows=pub.channels||pub.entries||[];
    (Array.isArray(rows)?rows:[]).forEach(e=>nodes.push(detailP((e.label||e.channel||'')+' · '+(e.status||''))));
  }
  setDetail(nodes);
}
async function runPublish(el){
  const exp=el._export; if(!exp||!RUN)return;
  $('#jobmsg').textContent='Publishing…';
  try{
    const r=await fetch('/api/distribution/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({run:RUN, export_id:exp.export_id})});
    let status=await r.json().catch(()=>({}));
    if(!r.ok){setTag(el,'failed'); $('#jobmsg').textContent=status.error||'Publish failed'; return}
    for(let i=0;i<40;i++){
      const rows=status.channels||status.entries||[];
      if(!rows.some(e=>e.state==='uploading'||e.status==='uploading'))break;
      await new Promise(res=>setTimeout(res,800));
      const g=await fetch('/api/distribution/publish/'+encodeURIComponent(RUN));
      if(!g.ok)break;
      status=await g.json();
    }
    el._publish=status;
    setTag(el, publishStatusTag(status.channels||status.entries||[]));
    $('#jobmsg').textContent='';
    renderDistDetail(el);
  }catch(e){setTag(el,'failed'); $('#jobmsg').textContent='Publish failed'}
}
async function runExport(el, variant){
  $('#jobmsg').textContent='Exporting…';
  const body={run:RUN, channels:DIST_CHANNELS, mode:'auto'};
  if(variant)body.variant_id=variant;
  try{
    const r=await fetch('/api/distribution/export',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){setTag(el,'failed'); $('#jobmsg').textContent=data.error||'Export failed'; setDetail([detailP(data.error||'Export failed')]); return}
    el._export=data;
    const src=data.copy_source||'template';
    setTag(el, src);
    const zip=el.querySelector('a.zip');
    if(zip&&data.bundle_url){zip.hidden=false; zip.href=data.bundle_url}
    const chs=data.channels||[];
    const mine=chs.find(c=>c.variant_id===variant&&c.video&&c.video.url)||chs.find(c=>c.video&&c.video.url);
    const v=el.querySelector('video');
    if(mine&&mine.video&&mine.video.url&&v){v.src=mine.video.url; v.play().catch(()=>{})}
    try{
      const dr=await fetch('/api/distribution/dashboard/'+encodeURIComponent(RUN));
      if(dr.ok)el._dash=await dr.json();
    }catch(e){}
    renderDistDetail(el);
    if(el.dataset.action==='publish')await runPublish(el);
    else $('#jobmsg').textContent='';
  }catch(e){setTag(el,'failed'); $('#jobmsg').textContent='Export failed'}
}
function spawnPublish(parent, media, variant){
  const id='pub_'+(seq++);
  const p=pos(parent);
  const head=`<span class="k">Publish</span><span class="tag" data-srctag>export</span><a class="zip" hidden href="#" title="Download bundle">⬇</a>`;
  const body=`<div class="thumb" data-v="${media.video}"><video src="${media.video}" poster="${media.poster||''}" muted loop playsinline autoplay></video></div>`;
  const el=blk(world,id,'clip',p.x,p.y+parent.offsetHeight+28,200,head,body);
  el.dataset.variant=variant||'';
  el.dataset.kind='publish';
  el.dataset.action='export';
  LINKS.push([parent.id,id,'#c084fc',2,.75]);
  wires();
  return el;
}
function dropChip(chip, parent){
  const media=mediaOf(parent); if(!media||!media.video)return;
  const prev=(parent.dataset.chips||'').split(',').filter(Boolean);
  const variant=parent.dataset.variant||'';
  if(chip==='publish'){
    const el=spawnPublish(parent, media, variant);
    runExport(el, variant);
    return;
  }
  if(chip==='approaches'){
    const specs=[['Fast punchy','len15','zoom','captions'],['Calm story','len45'],['Big captions','len30','captions','hook']];
    specs.forEach((spec,i)=>{
      const name=spec[0], chips=prev.concat(spec.slice(1));
      const el=spawnNode(parent, chips, name, media.video, media.poster, variant);
      el.style.left=(pos(parent).x+i*215)+'px';
      el.dataset.parent=parent.id;
      startBranch(el, chips, variant, media.video);
    });
    wires(); return;
  }
  const chips=prev.concat([chip]);
  const el=spawnNode(parent, chips, CHIP_NAME[chip]||chip, media.video, media.poster, variant);
  el.dataset.parent=parent.id;
  startBranch(el, chips, variant, media.video);
}
const ghost=$('#ghost');
document.querySelectorAll('#chips [data-chip]').forEach(ch=>{
  ch.addEventListener('pointerdown',e=>{
    if(e.button!=null && e.button!==0)return;
    chipDrag={chip:ch.dataset.chip, name:ch.textContent};
    ghost.textContent=ch.textContent; ghost.style.display='block';
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    ch.setPointerCapture(e.pointerId);
  });
  ch.addEventListener('pointermove',e=>{
    if(!chipDrag)return;
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    ghost.style.display='none';
    const hit=document.elementFromPoint(e.clientX,e.clientY);
    ghost.style.display='block';
    document.querySelectorAll('.blk.hot').forEach(n=>n.classList.remove('hot'));
    const host=hit&&hit.closest&&hit.closest('.blk');
    if(host&&host.querySelector('video'))host.classList.add('hot');
  });
  ch.addEventListener('pointerup',e=>{
    if(!chipDrag)return;
    ghost.style.display='none';
    document.querySelectorAll('.blk.hot').forEach(n=>n.classList.remove('hot'));
    const hit=document.elementFromPoint(e.clientX,e.clientY);
    const host=hit&&hit.closest&&hit.closest('.blk');
    const chip=chipDrag.chip; chipDrag=null;
    if(host&&host.querySelector('video'))dropChip(chip, host);
  });
});
window.CC.drop=(chip,id)=>dropChip(chip, document.getElementById(id));
