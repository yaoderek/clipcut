app = "clipcut-dubhacks"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"

[mounts]
  source = "clipcut_runs"
  destination = "/app/runs"
  initial_size = "1gb"
